name: Build & deploy directory

on:
  push:
    branches: [main]
  schedule:
    # weekly rebuild with fresh registry data (Thursdays 06:20 CT = 12:20 UTC)
    - cron: "20 12 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull fresh TDLR registry data
        run: python scripts/pull_data.py
      - name: Clean + dedupe entities
        run: python scripts/prep.py
      - name: Build static site
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4